# Typecheck, lint and both test suites on every push to main and every pull
# request (#104), each in a job of its own, so they run side by side and one
# failing doesn't stop the others (#131). The repository is public: this
# workflow uses no secrets, and never runs on pull_request_target, so a fork's
# pull request can't reach any.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# prisma.config.ts reads it, so even generating the client needs it. It matches
# Docker Compose's database, as the API tests' Postgres does.
env:
  DATABASE_URL: postgresql://flashcards:flashcards@localhost:5432/flashcards

jobs:
  typecheck:
    # Pinned, not ubuntu-latest, so a newer Ubuntu arrives in a commit CI
    # checks, not silently when GitHub moves ubuntu-latest (#111).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint

  web-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter web test run

  api-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    # The API tests make a Postgres schema per suite, as they do locally
    # against Docker Compose's database; these credentials match it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: flashcards
          POSTGRES_PASSWORD: flashcards
          POSTGRES_DB: flashcards
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U flashcards"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm --filter api test
